<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE LAB · 内容管理</title>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1a1a18;--muted:#8a877e;--border:#e8e6df;--lime:#d6f24b;--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;padding:32px}
.wrap{max-width:860px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.badge{width:34px;height:34px;border-radius:10px;background:#2b2b28;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
h1{font-size:24px;margin-bottom:4px}
.sub{color:var(--muted);font-size:12px;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=password],textarea,select{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;background:#fbfaf7}
textarea{min-height:90px;resize:vertical}
button{border:none;border-radius:999px;padding:9px 20px;font-size:13px;cursor:pointer;background:#2b2b28;color:#fff}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}
button.lime{background:var(--lime);color:var(--ink);font-weight:700}
button.danger{background:#fff;color:#d05a4e;border:1px solid #eec5c0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:140px}
.row>button{flex:0 0 auto}
.item{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fbfaf7;display:flex;gap:10px;align-items:center}
.item b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg{font-size:12px;margin-top:8px;color:var(--muted)}
.ok{color:#3e8e5a}.err{color:#d05a4e}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px}
.tab.active{background:#2b2b28;color:#fff;border-color:#2b2b28}
.panel{display:none}.panel.active{display:block}
details{margin-bottom:12px}summary{cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><div class="badge">V</div><div><h1>内容管理</h1><div class="sub">VIBE LAB · 单站长编辑 · 数据保存到 GitHub 仓库 content/ 目录</div></div></div>

  <div class="card" id="auth-card">
    <b>① 连接仓库</b>
    <label>GitHub Token（需 Contents: Read and write 权限，仅保存在你浏览器 localStorage）</label>
    <input type="password" id="token" placeholder="github_pat_...">
    <div class="row" style="margin-top:12px">
      <button class="lime" onclick="saveToken()">连接</button>
      <button class="ghost" onclick="forgetToken()">断开</button>
      <span class="msg" id="auth-msg"></span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-t="modules" onclick="showTab(this)">核心知识模块</div>
    <div class="tab" data-t="projects" onclick="showTab(this)">项目实战</div>
    <div class="tab" data-t="prompts" onclick="showTab(this)">Prompt 模板</div>
  </div>

  <div class="panel active" id="p-modules"><div class="card">
    <b>② 新建 / 编辑模块</b>
    <div class="row"><div><label>图标</label><input type="text" id="m-icon" placeholder="✳"></div><div><label>标题</label><input type="text" id="m-title"></div></div>
    <label>简介</label><textarea id="m-summary"></textarea>
    <label>要点（每行一条）</label><textarea id="m-points"></textarea>
    <label>产出</label><input type="text" id="m-output">
    <div class="row" style="margin-top:12px"><button onclick="addItem('modules')">＋ 添加到列表</button></div>
  </div>
  <div class="card"><b>已有模块</b><div id="list-modules" style="margin-top:10px"></div></div></div>

  <div class="panel" id="p-projects"><div class="card">
    <b>② 新建 / 编辑项目</b>
    <div class="row"><div><label>标题</label><input type="text" id="p-title"></div><div><label>强调色</label><input type="text" id="p-color" placeholder="#e07a5f"></div></div>
    <label>描述</label><textarea id="p-desc"></textarea>
    <label>标签（逗号分隔）</label><input type="text" id="p-chips" placeholder="全栈, 3 天">
    <label>要做的准备（每行一条，可空）</label><textarea id="p-prep"></textarea>
    <div class="row" style="margin-top:12px"><button onclick="addItem('projects')">＋ 添加到列表</button></div>
  </div>
  <div class="card"><b>已有项目</b><div id="list-projects" style="margin-top:10px"></div></div></div>

  <div class="panel" id="p-prompts"><div class="card">
    <b>② 新建 / 编辑 Prompt 模板</b>
    <div class="row"><div><label>标题</label><input type="text" id="t-title"></div><div><label>强调色</label><input type="text" id="t-color" placeholder="#5fb87a"></div></div>
    <label>模板内容（【】为占位符）</label><textarea id="t-prompt"></textarea>
    <div class="row" style="margin-top:12px"><button onclick="addItem('prompts')">＋ 添加到列表</button></div>
  </div>
  <div class="card"><b>已有模板</b><div id="list-prompts" style="margin-top:10px"></div></div></div>

  <div class="card">
    <b>③ 发布到线上</b>
    <p style="color:var(--muted);font-size:12px;margin:6px 0 12px">发布 = 提交到仓库 main 分支，GitHub Actions 会自动重新部署（约 1-2 分钟生效）。每次发布生成一条 commit，可随时回退。</p>
    <div class="row">
      <button class="lime" onclick="publishAll()">🚀 发布全部改动</button>
      <button class="ghost" onclick="reloadFromRepo()">↻ 从仓库重新拉取</button>
      <span class="msg" id="pub-msg"></span>
    </div>
    <details style="margin-top:14px"><summary>高级：直接编辑 JSON</summary>
      <label>文件名</label>
      <select id="raw-file"><option>modules</option><option>projects</option><option>prompts</option></select>
      <label>JSON 内容</label><textarea id="raw-json" style="min-height:200px;font-family:monospace"></textarea>
      <div class="row" style="margin-top:10px"><button onclick="loadRaw()">载入</button><button onclick="saveRaw()">保存该文件</button></div>
    </details>
  </div>
</div>

<script>
const REPO='Sky-Blue-Ai/vibe-coding-repo';
const store={
  get t(){return localStorage.getItem('vl_token')||'';},
  set t(v){localStorage.setItem('vl_token',v);},
  data:{modules:[],projects:[],prompts:[]},
  dirty:{modules:false,projects:false,prompts:false}
};
function $(id){return document.getElementById(id)}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function showTab(el){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===el));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  $('p-'+el.dataset.t).classList.add('active');}
function msg(id,text,ok){$(id).textContent=text;$(id).className='msg '+(ok?'ok':'err')}

/* auth */
function saveToken(){store.t=$('token').value.trim();checkAuth();}
function forgetToken(){store.t='';$('token').value='';msg('auth-msg','已断开',true);}
async function gh(path,opts={}){
  const r=await fetch('https://api.github.com'+path,{...opts,headers:{Authorization:'Bearer '+store.t,Accept:'application/vnd.github+json','Content-Type':'application/json',...(opts.headers||{})}});
  if(!r.ok) throw new Error('GitHub API '+r.status+': '+(await r.text()).slice(0,200));
  return r.json();
}
async function checkAuth(){
  if(!store.t){msg('auth-msg','未连接',false);return;}
  try{await gh('/repos/'+REPO);msg('auth-msg','✓ 已连接 '+REPO,true);reloadFromRepo();}
  catch(e){msg('auth-msg','连接失败：'+e.message,false);}
}

/* load / save repo json */
async function fetchRemote(name){
  const r=await fetch('https://raw.githubusercontent.com/'+REPO+'/main/content/'+name+'.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error(name+': '+r.status);
  return r.json();
}
async function reloadFromRepo(){
  if(!store.t){return;}
  try{
    for(const n of ['modules','projects','prompts']) store.data[n]=await fetchRemote(n);
    renderAll();msg('pub-msg','已从仓库加载最新内容',true);
  }catch(e){msg('pub-msg','拉取失败：'+e.message,false);}
}
async function putFile(name,content){
  // get sha
  let sha;try{const meta=await gh('/repos/'+REPO+'/contents/content/'+name+'.json');sha=meta.sha;}catch(e){}
  await gh('/repos/'+REPO+'/contents/content/'+name+'.json',{method:'PUT',body:JSON.stringify({
    message:'content: update '+name+' via admin',content:btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2)))),sha})});
}
async function publishAll(){
  const names=['modules','projects','prompts'].filter(n=>store.dirty[n]);
  if(!names.length){msg('pub-msg','没有需要发布的改动',true);return;}
  try{
    for(const n of names){await putFile(n,store.data[n]);store.dirty[n]=false;}
    msg('pub-msg','✓ 已发布 '+names.join(', ')+'，等待 Actions 部署（1-2 分钟）',true);
  }catch(e){msg('pub-msg','发布失败：'+e.message,false);}
}

/* render lists */
function renderAll(){['modules','projects','prompts'].forEach(renderList);}
function renderList(kind){
  const box=$('list-'+kind);const arr=store.data[kind];
  box.innerHTML=arr.length?arr.map((it,i)=>`<div class="item"><b>${esc(it.title)}</b>
    <button class="ghost" onclick="editItem('${kind}',${i})">编辑</button>
    <button class="ghost" onclick="moveItem('${kind}',${i},-1)">↑</button>
    <button class="ghost" onclick="moveItem('${kind}',${i},1)">↓</button>
    <button class="danger" onclick="delItem('${kind}',${i})">删除</button></div>`).join('')
    :'<span class="msg">暂无内容</span>';
  store.dirty[kind]=true;
}
function delItem(kind,i){if(confirm('确定删除「'+store.data[kind][i].title+'」？（点发布后才真正提交）')){store.data[kind].splice(i,1);renderList(kind);}}
function moveItem(kind,i,d){const a=store.data[kind];const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];renderList(kind);}
function editItem(kind,i){
  const it=store.data[kind][i];
  if(kind==='modules'){$('m-icon').value=it.icon||'';$('m-title').value=it.title;$('m-summary').value=it.summary;$('m-points').value=(it.points||[]).join('\n');$('m-output').value=it.output||'';store.data[kind].splice(i,1);renderList(kind);}
  if(kind==='projects'){$('p-title').value=it.title;$('p-color').value=it.color||'';$('p-desc').value=it.desc;$('p-chips').value=(it.chips||[]).join(', ');$('p-prep').value=(it.prep||[]).join('\n');store.data[kind].splice(i,1);renderList(kind);}
  if(kind==='prompts'){$('t-title').value=it.title;$('t-color').value=it.color||'';$('t-prompt').value=it.prompt;store.data[kind].splice(i,1);renderList(kind);}
}
function addItem(kind){
  let it;
  if(kind==='modules') it={icon:$('m-icon').value.trim(),title:$('m-title').value.trim(),summary:$('m-summary').value.trim(),points:$('m-points').value.split('\n').map(s=>s.trim()).filter(Boolean),output:$('m-output').value.trim()};
  if(kind==='projects') it={title:$('p-title').value.trim(),color:$('p-color').value.trim(),desc:$('p-desc').value.trim(),chips:$('p-chips').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),prep:$('p-prep').value.split('\n').map(s=>s.trim()).filter(Boolean)};
  if(kind==='prompts') it={title:$('t-title').value.trim(),color:$('t-color').value.trim(),prompt:$('t-prompt').value.trim()};
  if(!it.title){alert('请填标题');return;}
  store.data[kind].push(it);renderList(kind);msg('pub-msg','已加入「'+it.title+'」，记得点发布',true);
  ['m-title','m-summary','m-points','m-output','p-title','p-desc','p-chips','p-prep','t-title','t-prompt'].forEach(id=>{if($(id))$(id).value='';});
}
/* raw json */
async function loadRaw(){
  try{$('raw-json').value=JSON.stringify(await fetchRemote($('raw-file').value),null,2);msg('pub-msg','已载入 '+$('raw-file').value,true);}
  catch(e){msg('pub-msg','载入失败：'+e.message,false);}
}
async function saveRaw(){
  try{const c=JSON.parse($('raw-json').value);await putFile($('raw-file').value,c);store.data[$('raw-file').value]=c;renderList($('raw-file').value);msg('pub-msg','✓ 已保存 '+$('raw-file').value+',等待部署',true);}
  catch(e){msg('pub-msg','保存失败：'+e.message,false);}
}
$('token').value=store.t;checkAuth();
</script>
</body>
</html>
